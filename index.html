<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabna3D</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

            <!-- LOGO Y NOMBRE DE LA TIENDA -->
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Logo de mi tienda" class="h-10 w-10 rounded-full object-cover border border-slate-700">
                <h1 class="text-xl font-bold tracking-wide">Fabna3D</h1>
            </div>

            <!-- Botón Carrito -->
            <button id="cart-btn" onclick="toggleCart()" class="relative bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                <span>🛒 Carrito</span>
                <span id="cart-count" class="bg-white text-emerald-700 font-bold px-2 py-0.5 rounded-full text-xs">0</span>
            </button>

        </div>
    </header>
  
  <!-- Catálogo de Productos -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold mb-6 text-gray-900">Nuestros Productos</h2>
    <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Los productos se cargan dinámicamente con JS -->
    </div>
  </main>

  <!-- Slide-over / Modal del Carrito -->
  <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-xl">
      <div>
        <div class="flex justify-between items-center border-b pb-4 mb-4">
          <h3 class="text-xl font-bold text-gray-800">Tu Pedido</h3>
          <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
        </div>

        <!-- Items del Carrito -->
        <div id="cart-items" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
          <!-- Se llena dinámicamente -->
        </div>
      </div>

      <!-- Footer del Carrito -->
      <div class="border-t pt-4 mt-auto">
        <div class="flex justify-between items-center text-lg font-bold mb-4">
          <span>Total estimado:</span>
          <span id="cart-total" class="text-emerald-700">$0</span>
        </div>
        
        <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold text-center tracking-wide transition flex items-center justify-center gap-2">
          <span>Enviar pedido por WhatsApp</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // === CONFIGURACIÓN ===
    // Reemplaza por tu número de teléfono con código de país (ej: 5491112345678 para Argentina)
    const PHONE_NUMBER = "5491141976954";

    // Productos de ejemplo
    const products = [
      { id: 1, name: "Producto 1", price: 12500, desc: "Descripción corta del producto 1.", image: "pokemoncuadro.png" },
      { id: 2, name: "Producto 2", price: 4200, desc: "Descripción corta del producto 2.", image: "producto1.jpg" },
      { id: 3, name: "Producto 3", price: 1800, desc: "Descripción corta del producto 3.", image: "producto1.jpg" },
      { id: 4, name: "Producto 4", price: 6500, desc: "Descripción corta del producto 4.", image: "producto1.jpg" }
    ];

    let cart = [];

    // Renderizar Productos
    function renderProducts() {
      const container = document.getElementById('product-list');
      container.innerHTML = products.map(p => `
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col justify-between hover:shadow-md transition">
          <div>
            <div class="h-40 bg-gray-100 rounded-lg mb-4 flex items-center justify-center text-gray-400 font-medium">
              [ Imagen ${p.id} ]
            </div>
            <h3 class="font-bold text-lg mb-1">${p.name}</h3>
            <p class="text-gray-500 text-sm mb-4">${p.desc}</p>
          </div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-lg font-bold text-gray-900">$${p.price.toLocaleString('es-AR')}</span>
            <button onclick="addToCart(${p.id})" class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">
              + Agregar
            </button>
          </div>
        </div>
      `).join('');
    }

    // Agregar al carrito
    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty++;
      } else {
        const prod = products.find(p => p.id === id);
        cart.push({ ...prod, qty: 1 });
      }
      updateCartUI();
    }

    // Cambiar cantidad
    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      updateCartUI();
    }

    // Actualizar UI del carrito
    function updateCartUI() {
      const itemsContainer = document.getElementById('cart-items');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');

      const totalCount = cart.reduce((acc, item) => acc + item.qty, 0);
      const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

      countEl.textContent = totalCount;
      totalEl.textContent = `$${totalPrice.toLocaleString('es-AR')}`;

      if (cart.length === 0) {
        itemsContainer.innerHTML = `<p class="text-gray-400 text-center py-8">El carrito está vacío.</p>`;
        return;
      }

      itemsContainer.innerHTML = cart.map(item => `
        <div class="flex justify-between items-center border-b pb-3">
          <div>
            <h4 class="font-medium text-gray-800">${item.name}</h4>
            <p class="text-xs text-gray-500">$${item.price.toLocaleString('es-AR')} c/u</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="updateQty(${item.id}, -1)" class="w-7 h-7 bg-gray-200 rounded text-gray-700 font-bold hover:bg-gray-300">-</button>
            <span class="font-medium text-sm w-4 text-center">${item.qty}</span>
            <button onclick="updateQty(${item.id}, 1)" class="w-7 h-7 bg-gray-200 rounded text-gray-700 font-bold hover:bg-gray-300">+</button>
          </div>
        </div>
      `).join('');
    }

    // Mostrar / Ocultar Carrito
    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.classList.toggle('hidden');
    }

    // Enviar mensaje a WhatsApp
    function sendToWhatsApp() {
      if (cart.length === 0) {
        alert("El carrito está vacío.");
        return;
      }

      let text = "Hola! Quisiera realizar el siguiente pedido:\n\n";
      let total = 0;

      cart.forEach(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        text += `• ${item.name} x${item.qty} - $${subtotal.toLocaleString('es-AR')}\n`;
      });

      text += `\n*Total estimado:* $${total.toLocaleString('es-AR')}`;
      
      const encodedText = encodeURIComponent(text);
      const url = `https://wa.me/${PHONE_NUMBER}?text=${encodedText}`;

      window.open(url, '_blank');
    }

    // Inicializar
    renderProducts();
  </script>
</body>
</html>
